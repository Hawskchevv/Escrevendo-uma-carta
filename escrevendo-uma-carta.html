!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Uma carta para abrir devagar.">
  <title>Para você, com amor</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #50403d;
      --rose: #bd6576;
      --rose-dark: #91485a;
      --rose-soft: #e8c9c8;
      --samsung: "SamsungOne", "Samsung One", "SamsungOneUI", system-ui, sans-serif;
      font-family: var(--samsung);
      background: #000;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100vh; min-height: 100svh; overflow: hidden; background: #000; }
    .stage {
      position: relative;
      display: grid;
      width: 100%; min-height: 100vh; min-height: 100svh;
      place-items: center;
      overflow: hidden;
      padding: 20px;
      background: #000;
      isolation: isolate;
    }
    .scene {
      position: relative;
      width: min(660px, 100%);
      height: min(690px, calc(100svh - 40px));
      min-height: 540px;
      isolation: isolate;
    }
    .envelope {
      position: absolute;
      z-index: 3;
      right: 0; bottom: 42px; left: 0;
      width: min(390px, 84vw); height: 240px;
      margin: auto;
      opacity: 0;
      transform: translateY(90px);
      animation: envelope-arrive 1.15s cubic-bezier(.2,.75,.18,1) .12s forwards;
      filter: drop-shadow(0 18px 23px rgb(0 0 0 / 42%));
    }
    .env-shadow {
      position: absolute; z-index: 0; inset: 8px -2px -1px;
      border-radius: 5px; background: #e8d9d2;
      box-shadow: 0 17px 26px rgb(0 0 0 / 25%);
    }
    .env-back {
      position: absolute; z-index: 1; inset: 0;
      overflow: hidden; border: 1px solid rgb(172 129 125 / 35%); border-radius: 5px;
      background: linear-gradient(145deg,#f0ded9,#e5c9c6 58%,#d9b7b6);
      box-shadow: inset 0 1px 1px rgb(255 255 255 / 70%);
    }
    .env-back::before, .env-back::after {
      position: absolute; bottom: 0; width: 50%; height: 100%; content: ""; opacity: .5;
    }
    .env-back::before { left: 0; clip-path: polygon(0 0,100% 50%,0 100%); background: linear-gradient(30deg,#dcbdbc,#f2e2dd); }
    .env-back::after { right: 0; clip-path: polygon(100% 0,0 50%,100% 100%); background: linear-gradient(330deg,#d7b5b4,#f1dfda); }
    .env-grain {
      position: absolute; z-index: 7; inset: 0; border-radius: 5px; pointer-events: none;
      opacity: .13; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
    }
    .env-front {
      position: absolute; z-index: 5; inset: 0; border-radius: 0 0 5px 5px;
      clip-path: polygon(0 0,50% 48%,100% 0,100% 100%,0 100%);
      background: linear-gradient(158deg,rgb(255 255 255 / 23%),transparent 54%),linear-gradient(125deg,#ecd8d4,#e4c8c6 58%,#ddc0be);
      transition: opacity .8s ease, transform .9s ease;
    }
    .env-flap {
      position: absolute; z-index: 6; top: 0; width: 50.5%; height: 67%;
      border: 1px solid rgb(168 119 119 / 25%);
      background: linear-gradient(155deg,#f1dfda,#dfbfbd 88%);
      backface-visibility: hidden;
    }
    .env-flap.left {
      left: 0; clip-path: polygon(0 0,100% 0,100% 75%,92% 80%,84% 75%,76% 82%,68% 76%,60% 83%,52% 77%,44% 83%,36% 76%,28% 82%,20% 75%,12% 80%,0 76%);
    }
    .env-flap.right {
      right: 0; background: linear-gradient(205deg,#f1dfda,#dfbfbd 88%);
      clip-path: polygon(0 0,100% 0,100% 76%,88% 80%,80% 75%,72% 82%,64% 76%,56% 83%,48% 77%,40% 82%,32% 76%,24% 82%,16% 75%,8% 80%,0 76%);
    }
    .seal {
      position: absolute; z-index: 9; top: 39%; left: 50%;
      display: grid; width: 82px; height: 82px; padding: 0; place-items: center;
      border: 0; border-radius: 50%; background: transparent; cursor: pointer;
      transform: translate(-50%,-50%);
      transition: transform .25s ease, filter .25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .seal:hover { transform: translate(-50%,-54%) scale(1.055); filter: brightness(1.06) drop-shadow(0 6px 6px rgb(113 50 63 / 28%)); }
    .seal:active { transform: translate(-50%,-47%) scale(.96); }
    .seal:focus-visible { outline: 2px solid #f1c3c7; outline-offset: 5px; }
    .seal svg { width: 76px; height: 72px; overflow: visible; filter: drop-shadow(0 5px 4px rgb(101 40 56 / 32%)); }
    .seal-mark {
      position: absolute; top: 43%; left: 50%; color: rgb(255 231 225 / 90%);
      font: 1.4rem/1 var(--samsung); text-shadow: 0 1px 0 rgb(103 36 48 / 40%);
      transform: translate(-50%,-50%);
    }
    .paper {
      position: absolute; z-index: 2; bottom: 50px; left: 50%;
      display: flex; width: min(430px,90vw); height: min(580px,calc(100svh - 130px)); min-height: 420px;
      flex-direction: column; padding: 40px clamp(27px,7vw,49px) 22px; overflow: auto;
      border: 1px solid #ebdfd3; border-radius: 2px;
      background: linear-gradient(90deg,transparent 0 20px,rgb(214 167 163 / 16%) 20px 21px,transparent 21px),repeating-linear-gradient(0deg,rgb(137 111 91 / 1.4%) 0 1px,transparent 1px 4px),linear-gradient(112deg,#fffefb,#fffdf7 72%,#fbf5ed);
      box-shadow: 0 19px 45px rgb(0 0 0 / 36%),0 2px 5px rgb(104 70 65 / 10%),inset 0 0 28px rgb(170 131 105 / 4%);
      opacity: 0; transform: translate(-50%,68%); scrollbar-width: thin; scrollbar-color: #dec3be transparent;
    }
    .paper::before {
      position: absolute; inset: 10px; border: 1px solid rgb(202 151 151 / 30%); content: ""; pointer-events: none;
    }
    .paper::after {
      position: absolute; top: 17px; left: 50%; width: 38px; height: 1px;
      background: #d3a4a0; content: ""; transform: translateX(-50%);
    }
    .ornament-top, .ornament-bottom {
      position: absolute; z-index: 1; color: #c17e83; font: 1.55rem/1 var(--samsung); opacity: .78; pointer-events: none;
    }
    .ornament-top { top: 18px; right: 20px; }
    .ornament-bottom { bottom: 58px; left: 20px; transform: rotate(180deg); }
    .rule { position: relative; z-index: 1; display: flex; flex: 0 0 auto; align-items: center; justify-content: center; margin: 5px 0 19px; color: #bd7580; font-size: .9rem; }
    .rule::before, .rule::after { width: 46px; height: 1px; background: linear-gradient(90deg,transparent,#d8b0a9); content: ""; }
    .rule::after { transform: rotate(180deg); }
    .rule span { margin: 0 10px; }
    .copy-wrap { position: relative; z-index: 1; flex: 1 0 auto; }
    .copy {
      color: var(--ink); font-family: var(--samsung); font-size: clamp(1.04rem,2vw,1.2rem);
      font-weight: 400; line-height: 1.48; letter-spacing: .007em;
    }
    .copy p { min-height: 1.48em; margin: 0 0 12px; }
    .copy .greeting { margin-bottom: 15px; color: #8d4d5a; font-size: 1.2em; font-style: italic; }
    .copy .closing { margin-top: 19px; margin-bottom: 6px; color: #8d4d5a; font-style: italic; }
    .copy .signature { margin: 5px 0 0; color: #a25564; font-size: 1.25em; font-style: italic; }
    .copy .author { margin: 5px 0 0; color: #a25564; font-size: .92em; font-weight: 500; letter-spacing: .035em; }
    .copy.editing { outline: 1px dashed rgb(169 98 110 / 42%); outline-offset: 5px; cursor: text; }
    .edit-control { position: relative; z-index: 2; display: flex; flex: 0 0 auto; justify-content: flex-end; margin-top: 7px; padding-top: 6px; border-top: 1px solid rgb(192 140 140 / 25%); }
    .edit-button { display: grid; width: 28px; height: 28px; padding: 5px; place-items: center; border: 0; background: transparent; color: #9a5662; opacity: 0; pointer-events: none; cursor: pointer; transition: opacity .25s ease,color .2s ease; }
    .edit-button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5; }
    .edit-button:hover, .edit-button:focus-visible { color: #6f3644; }
    .scene.opening .seal, .scene.open .seal { pointer-events: none; animation: wax-fracture .62s cubic-bezier(.2,.75,.25,1) forwards; }
    .scene.opening .left, .scene.open .left { animation: tear-left 1.25s cubic-bezier(.22,.72,.18,1) .12s forwards; }
    .scene.opening .right, .scene.open .right { animation: tear-right 1.32s cubic-bezier(.25,.75,.16,1) .1s forwards; }
    .scene.opening .env-front, .scene.open .env-front { opacity: .25; transform: translateY(23px); }
    .scene.opening .paper, .scene.open .paper { z-index: 10; opacity: 1; animation: paper-rise 1.75s cubic-bezier(.18,.76,.2,1) .36s both; }
    .scene.open .paper { animation: none; opacity: 1; transform: translate(-50%,0); }
    .scene.complete .edit-button { opacity: 1; pointer-events: auto; }
    @keyframes envelope-arrive { to { opacity: 1; transform: translateY(0); } }
    @keyframes wax-fracture { 0%{opacity:1;transform:translate(-50%,-50%) scale(1)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(-5deg)}62%{opacity:.66;transform:translate(calc(-50% + 3px),calc(-50% - 6px)) scale(.82) rotate(7deg)}100%{opacity:0;transform:translate(calc(-50% - 5px),calc(-50% - 16px)) scale(.45) rotate(-8deg)} }
    @keyframes tear-left { 0%{opacity:1;transform:translate3d(0,0,0) skewX(0) scaleY(1)}32%{opacity:1;transform:translate3d(-4px,8px,0) skewX(-1.8deg) scaleY(1.04)}68%{opacity:.82;transform:translate3d(-45px,-34px,0) skewX(-5deg) scaleY(.96)}100%{opacity:.12;transform:translate3d(-118px,-112px,0) skewX(-8deg) scaleY(.88)} }
    @keyframes tear-right { 0%{opacity:1;transform:translate3d(0,0,0) skewX(0) scaleY(1)}27%{opacity:1;transform:translate3d(5px,5px,0) skewX(2deg) scaleY(1.03)}66%{opacity:.76;transform:translate3d(39px,-42px,0) skewX(5deg) scaleY(.95)}100%{opacity:.1;transform:translate3d(121px,-104px,0) skewX(9deg) scaleY(.84)} }
    @keyframes paper-rise { 0%{opacity:0;transform:translate(-50%,68%)}17%{opacity:1}58%{transform:translate(calc(-50% + 1px),20%)}76%{transform:translate(calc(-50% - 1px),-2%)}88%{transform:translate(-50%,1%)}100%{opacity:1;transform:translate(-50%,0)} }
    @keyframes wax-fracture { 0%{opacity:1;transform:translate(-50%,-50%) scale(1)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(-5deg)}62%{opacity:.66;transform:translate(calc(-50% + 3px),calc(-50% - 6px)) scale(.82) rotate(7deg)}100%{opacity:0;transform:translate(calc(-50% - 5px),calc(-50% - 16px)) scale(.45) rotate(-8deg)} }
    @media (max-width: 600px) {
      .stage { padding: 12px; }
      .scene { height: min(650px,calc(100svh - 24px)); min-height: 500px; }
      .envelope { bottom: 43px; width: min(360px,86vw); height: 218px; }
      .paper { bottom: 51px; width: min(410px,92vw); height: min(545px,calc(100svh - 90px)); min-height: 405px; padding: 37px 28px 19px; }
      .copy { font-size: clamp(1rem,4.1vw,1.13rem); line-height: 1.42; }
      .copy p { margin-bottom: 9px; }
      .copy .greeting { margin-bottom: 11px; }
      .copy .closing { margin-top: 14px; }
      .rule { margin-bottom: 14px; }
    }
    @media (max-height: 740px) and (min-width: 601px) {
      .scene { height: 530px; min-height: 530px; }
      .envelope { bottom: 36px; height: 205px; }
      .paper { bottom: 45px; height: min(450px,calc(100svh - 90px)); min-height: 400px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="scene" aria-label="Carta">
      <div class="envelope">
        <div class="env-shadow"></div>
        <div class="env-back"></div>
        <div class="env-flap left"></div>
        <div class="env-flap right"></div>
        <div class="env-front"></div>
        <div class="env-grain"></div>
        <button class="seal" type="button" aria-label="Romper o lacre e abrir a carta">
          <svg viewBox="0 0 100 94" aria-hidden="true">
            <defs>
              <radialGradient id="wax" cx="34%" cy="24%" r="80%"><stop offset="0" stop-color="#f0a2a9"/><stop offset=".52" stop-color="#cc6d7d"/><stop offset="1" stop-color="#9f4359"/></radialGradient>
              <linearGradient id="waxEdge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2b1b5" stop-opacity=".8"/><stop offset="1" stop-color="#7f3448" stop-opacity=".5"/></linearGradient>
            </defs>
            <path d="M50 88C43 82 8 57 8 32 8 13 30 5 45 20c2 2 4 5 5 7 2-3 4-6 7-8 16-14 37-5 36 14-2 23-32 48-43 55Z" fill="url(#wax)" stroke="url(#waxEdge)" stroke-width="3"/>
            <path d="M24 31c2-10 11-13 18-7" fill="none" stroke="#ffd9d8" stroke-linecap="round" stroke-width="2.5" opacity=".56"/>
          </svg>
          <span class="seal-mark" aria-hidden="true">♡</span>
        </button>
      </div>
      <article class="paper" aria-label="Carta para meu amor" aria-hidden="true">
        <span class="ornament-top" aria-hidden="true">❧</span>
        <div class="rule" aria-hidden="true"><span>♡</span></div>
        <div class="copy-wrap">
          <div class="copy" id="letterCopy" aria-live="polite">
            <p class="greeting" data-message="Meu amor,"></p>
            <p data-message="Às vezes, sinto que nenhuma palavra, por mais bela que seja, alcançaria para expressar a imensidão do que você representa para mim. Há em você algo que ilumina meus dias, alegra meus pensamentos e transforma até os momentos mais triviais em preciosas recordações."></p>
            <p data-message="Quero que tenha ciência de que não é apenas sua companhia que me cativa, mas a totalidade do seu ser. Suas manias, suas singularidades, a maneira como você percebe o mundo. Adoro desvendar cada detalhe seu."></p>
            <p data-message="Se há um anseio em meu coração, é manter a honra de trilhar seu caminho, zelar por nosso afeto e edificar ao seu lado memórias que o tempo jamais apague."></p>
            <p data-message="Você é, para mim, de um valor que transcende sua própria compreensão."></p>
            <p class="closing" data-message="Com todo o meu coração."></p>
            <p class="signature" data-message="Seu para sempre. BY: Hawskchevv &lt;3"></p>
          </div>
        </div>
        <span class="ornament-bottom" aria-hidden="true">❧</span>
        <div class="edit-control">
          <button class="edit-button" type="button" aria-label="Editar mensagem" aria-pressed="false" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16.5-.8 4.3 4.3-.8L19.8 7.7a2.5 2.5 0 0 0-3.5-3.5L4 16.5Z"/><path d="m14.8 5.8 3.5 3.5"/></svg>
          </button>
        </div>
      </article>
    </section>
  </main>
  <script>
    (() => {
      const scene = document.querySelector(".scene");
      const seal = document.querySelector(".seal");
      const paper = document.querySelector(".paper");
      const copy = document.querySelector("#letterCopy");
      const editButton = document.querySelector(".edit-button");
      const lines = [...copy.querySelectorAll("[data-message]")];
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let phase = "sealed";
      let isEditing = false;
      const messageParts = lines.map((line) => line.dataset.message || "");
      const totalCharacters = messageParts.reduce((total, text) => total + text.length, 0);

      const finishWriting = () => {
        lines.forEach((line, index) => { line.textContent = messageParts[index]; });
        phase = "open";
        scene.classList.remove("opening");
        scene.classList.add("open", "complete");
        paper.setAttribute("aria-hidden", "false");
        editButton.disabled = false;
      };

      const writeLetter = () => {
        if (reducedMotion.matches) { finishWriting(); return; }
        let written = 0;
        const timer = window.setInterval(() => {
          written = Math.min(written + 2, totalCharacters);
          let remaining = written;
          lines.forEach((line, index) => {
            const text = messageParts[index];
            const count = Math.max(0, Math.min(text.length, remaining));
            line.textContent = text.slice(0, count);
            remaining -= count;
          });
          if (written >= totalCharacters) {
            window.clearInterval(timer);
            phase = "open";
            scene.classList.add("complete");
            editButton.disabled = false;
          }
        }, 24);
      };

      seal.addEventListener("click", () => {
        if (phase !== "sealed") return;
        phase = "opening";
        seal.disabled = true;
        scene.classList.add("opening");
        window.setTimeout(() => {
          scene.classList.remove("opening");
          scene.classList.add("open");
          writeLetter();
        }, reducedMotion.matches ? 0 : 2350);
      });

      editButton.addEventListener("click", () => {
        if (phase !== "open") return;
        isEditing = !isEditing;
        copy.contentEditable = String(isEditing);
        copy.classList.toggle("editing", isEditing);
        editButton.setAttribute("aria-pressed", String(isEditing));
        editButton.setAttribute("aria-label", isEditing ? "Concluir edição da mensagem" : "Editar mensagem");
        if (isEditing) copy.focus();
  });
    })();
  </script>
</body>
</html>
